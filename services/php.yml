  php:
    platform: linux/x86_64
    build:
      context: containers/php
      args:
        PHP_VERSION: ${PHP_VERSION}
        HOST_USER_ID: ${HOST_USER_ID}
        HOST_GROUP_ID: ${HOST_GROUP_ID}
        HOST_USER_NAME: ${HOST_USER_NAME}
        HOST_GROUP_NAME: ${HOST_GROUP_NAME}
    environment:
      # Overrides xdebug.mode from containers/php/xdebug.ini. The default keeps
      # the previous behaviour. Set XDEBUG_MODE=off in .env while you are not
      # debugging, see README "Remote debugging with PHPSTORM".
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,profile}
    links:
      - "apache:localhost.local"
      - "apache:oxideshop.local"
    volumes:
      - ./source:/var/www:cached
      - ./data/php:/var/sync:cached
      - ./data/composer:/home/${HOST_USER_NAME}/.composer/:cached
    user: ${HOST_USER_ID}:${HOST_GROUP_ID}
    depends_on:
      mailpit:
        condition: service_started
      apache:
        condition: service_started
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
